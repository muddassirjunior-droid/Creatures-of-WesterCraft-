plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// Claude testing harness: dedicated GameTest source set (src/gametest/java),
// isolated from the main mod jar -- its fabric.mod.json (declaring the
// "fabric-gametest" entrypoint) is only ever on the classpath for the
// "gametest" run below, never for runClient/runServer/production builds.
sourceSets {
	gametest {
		java {
			srcDirs = ['src/gametest/java']
		}
		resources {
			srcDirs = ['src/gametest/resources']
		}
		compileClasspath += sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.runtimeClasspath
	}
}

// Claude testing harness: launch_minecraft.py --world "Name" sets this env var so
// the harness can auto-enter a singleplayer world instead of stopping at the main
// menu. A no-op (default vanilla behavior) whenever the env var isn't set.
tasks.named("runClient") {
	def quickplayWorld = System.getenv("CLAUDE_MC_QUICKPLAY_WORLD")
	if (quickplayWorld) {
		args("--quickPlaySingleplayer", quickplayWorld)
	}
}

loom {
	runs {
		gametest {
			inherit server
			name "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${file("$buildDir/junit.xml")}"
			source sourceSets.gametest
		}
	}
}

repositories {
	maven {
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
		content {
			includeGroup("software.bernie.geckolib")
			includeGroup("com.eliotlash.mclib")
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

	gametestImplementation sourceSets.main.output
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 17
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Add publishing repositories here later if needed.
	}
}
